<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PayFlow – Animasi Menyapa</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#91B900;--ink:#1a2200}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:'Fredoka',system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:412px;height:917px;flex:none;overflow:hidden;background:var(--bg)}
#glow{position:absolute;left:50%;top:398px;width:320px;height:320px;margin:-160px;border-radius:50%;background:radial-gradient(circle,#f4ff9a 0%,#d6ff2e66 35%,#d6ff2e00 70%);opacity:0}
.go #glow{animation:glow .8s ease-out forwards,breathe 2.4s ease-in-out .8s infinite}
@keyframes glow{0%{opacity:0;transform:scale(.2)}50%{opacity:.95;transform:scale(1.15)}100%{opacity:.55;transform:scale(1)}}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.8;transform:scale(1.08)}}
#ring{position:absolute;left:50%;top:398px;width:200px;height:200px;margin:-100px;border-radius:50%;border:3px solid #fff;opacity:0}
.go #ring{animation:ring .6s ease-out .3s forwards}
@keyframes ring{0%{opacity:.8;transform:scale(.4)}100%{opacity:0;transform:scale(2.6)}}
#robot{position:absolute;left:50%;top:300px;width:250px;margin-left:-125px;opacity:0;transform-origin:50% 60%}
#robot img{display:block;width:100%;filter:drop-shadow(0 8px 6px #0003)}
.go #robot{animation:pop .45s cubic-bezier(.3,1.4,.5,1) .05s forwards,greet 1.1s ease-in-out .5s,float 2s ease-in-out 1.6s infinite}
@keyframes pop{0%{opacity:0;transform:scale(.3) translateY(40px)}40%{opacity:1}100%{opacity:1;transform:none}}
@keyframes greet{0%{transform:none}15%{transform:rotate(-10deg) translateY(-8px)}35%{transform:rotate(9deg) translateY(-3px)}55%{transform:rotate(-8deg) translateY(-7px)}75%{transform:rotate(5deg) translateY(-2px)}100%{transform:none}}
@keyframes float{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:1;transform:translateY(-8px)}}
#robot .eye{position:absolute;display:block;height:auto;filter:none;transform-origin:50% 50%;animation:blink 3.6s ease-in-out infinite}
@keyframes blink{0%,12%,21%,100%{transform:scaleY(1)}14.5%,19%{transform:scaleY(.06)}16.8%{transform:scaleY(1)}}
#shadow{position:absolute;left:50%;top:508px;width:190px;height:20px;margin-left:-95px;border-radius:50%;background:#0003;filter:blur(5px);opacity:0}
.go #shadow{animation:shin .4s ease-out .2s forwards,shb 2s ease-in-out 1.6s infinite}
@keyframes shin{from{opacity:0;transform:scale(.15)}to{opacity:.8;transform:scale(1)}}
@keyframes shb{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:.5;transform:scale(.88)}}
.sp{position:absolute;color:#fff;font-size:22px;opacity:0;text-shadow:0 0 8px #fff9}
.go .sp{animation:tw .8s ease-in-out forwards}
@keyframes tw{0%{opacity:0;transform:scale(0) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(45deg)}100%{opacity:0;transform:scale(.3) rotate(90deg)}}
#bubble{position:absolute;left:50%;top:222px;margin-left:-100px;width:200px;padding:10px 0;text-align:center;background:#fff;color:var(--ink);font-size:24px;border-radius:24px;opacity:0;transform-origin:50% 100%;box-shadow:0 5px 0 #0002}
#bubble::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.go #bubble{animation:bp .35s cubic-bezier(.3,1.7,.5,1) .6s forwards}
@keyframes bp{0%{opacity:0;transform:scale(0) rotate(-10deg)}100%{opacity:1;transform:none}}
#logo{position:absolute;left:50%;top:560px;width:320px;margin-left:-160px;height:70.99px}
#logo img{position:absolute;top:0;height:100%;opacity:0}
#pay{left:0}#flow{left:29.81%}
.go #pay{animation:rise .5s ease-out .85s forwards}
.go #flow{animation:rise .5s ease-out .95s forwards}
@keyframes rise{0%{opacity:0;transform:translateY(24px);filter:blur(8px) brightness(1.8) drop-shadow(0 4px 3px #0003)}
60%{opacity:1;filter:blur(0) brightness(1.5) drop-shadow(0 4px 3px #0003)}
100%{opacity:1;transform:none;filter:blur(0) brightness(1) drop-shadow(0 4px 3px #0003)}}
@media (prefers-reduced-motion:reduce){.go *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style></head><body>
